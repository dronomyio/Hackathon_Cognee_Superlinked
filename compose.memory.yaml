services:
  cognee:
    image: cognee/cognee:main
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
      REQUIRE_AUTHENTICATION: "false"
      LLM_PROVIDER: openai
      LLM_MODEL: openai/zai-org/GLM-5.3-Flash:relay
      LLM_ENDPOINT: https://api.superlinked.com/v1
      LLM_API_KEY: ${SIE_API_KEY:?SIE_API_KEY is required}
      STRUCTURED_OUTPUT_FRAMEWORK: litellm_native
      EMBEDDING_PROVIDER: openai_compatible
      EMBEDDING_MODEL: BAAI/bge-m3
      EMBEDDING_ENDPOINT: https://api.superlinked.com/v1
      EMBEDDING_API_KEY: ${SIE_API_KEY:?SIE_API_KEY is required}
      EMBEDDING_DIMENSIONS: "1024"
      EMBEDDING_BATCH_SIZE: "1"
    volumes:
      - crypto_cognee_storage:/cognee-storage

volumes:
  crypto_cognee_storage:
